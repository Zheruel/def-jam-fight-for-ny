<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Battle patch e2e</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="outputCanvas" width="640" height="480" tabindex="0"></canvas>
<script type="module">
import Play from '/runtime/play/Play.js';
import { httpDisc, withBattlePatch } from '/battle/overlay.mjs';

const params = new URLSearchParams(location.search);
const state = window.e2e = { frames: 0, status: 'loading', error: '', reads: 0, patchedReads: 0 };

try {
  let source = await httpDisc('/disc.iso');
  if (params.get('patch') === 'overlay') {
    const manifest = await (await fetch('/battle-patch.json')).json();
    source = await withBattlePatch(source, manifest, {
      onPatchedRead: () => { state.patchedReads++; }
    });
  }
  const canvas = document.getElementById('outputCanvas');
  const module = await Play({
    canvas,
    mainScriptUrlOrBlob: new URL('/runtime/play/Play.js', location.href).href,
    locateFile: name => new URL('/runtime/play/' + name, location.href).href,
    onAbort: message => { state.error = String(message); state.status = 'aborted'; }
  });
  window.referenceVm = module; // Headless reference harness only, for reading match snapshots.
  module.FS.mkdir('/work');
  let done = true;
  module.discImageDevice = {
    getFileSize: () => source.size,
    isDone: () => done,
    read(dst, offset, size) {
      done = false;
      state.reads++;
      source.read(offset, size).then(data => {
        if (data.length !== size) throw new Error('short disc read');
        module.HEAPU8.set(data, dst);
      }).catch(error => {
        state.error = error.message;
        module.HEAPU8.fill(0, dst, dst + size);
      }).finally(() => { done = true; });
    }
  };
  module.ccall('initVm', '', [], []);
  module.bootDiscImage('reference.iso');
  state.pad = (buttons, port = 0) => module._setPad(port, buttons, 0, 0, 0, 0);
  state.readback = (port = 0) => module._getPadReadback?.(port);
  state.status = 'running';
  setInterval(() => { state.frames += module.getFrames(); module.clearStats(); }, 250);
} catch (error) {
  state.status = 'failed';
  state.error = error.stack || String(error);
}
</script>
</body>
</html>
