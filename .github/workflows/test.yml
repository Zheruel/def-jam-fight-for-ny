name: Browser checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run setup
      - run: npm test
      - run: npx playwright install --with-deps chromium
        working-directory: netplay
      - run: npm run test:netplay
