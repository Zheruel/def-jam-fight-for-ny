name: Browser checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run setup
      - run: python3 -m unittest discover -s tests -p test_package_game.py
      - run: python3 -m unittest discover -s ps2/battle/tests
      - run: python3 -m unittest discover -s ps2/content/tests
      - run: python3 -m unittest discover -s port/assets
      - run: python3 -m unittest discover -s port/geometry
      - run: node verification/native-combat.mjs
      - run: npm test
      - run: npx playwright install --with-deps chromium
        working-directory: netplay
      - run: npm run test:native-venue
      - run: npm run test:netplay
