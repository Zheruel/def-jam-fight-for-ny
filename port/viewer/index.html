<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The Foundation · Native geometry</title>
  <style>
    :root { color-scheme: dark; font: 1rem system-ui, sans-serif; background: #15181a; color: #f2f2ed; }
    body { margin: 0; display: grid; grid-template-rows: auto 1fr; height: 100dvh; }
    header { padding: 0.9rem 1.2rem; }
    h1 { margin: 0 0 .25rem; font-size: 1.25rem; }
    p { margin: 0; color: #bfc7c9; }
    label { float: right; margin-left: 1rem; }
    canvas { display: block; width: 100%; height: 100%; min-height: 0; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }
  </style>
</head>
<body>
  <header>
    <label><input id="cutaway" type="checkbox" checked> Fight floor cutaway</label>
    <h1>The Foundation</h1>
    <p id="status" role="status">Loading the PS2 venue mesh…</p>
  </header>
  <canvas tabindex="0" aria-label="Untextured venue geometry. Drag or use arrow keys to rotate. Scroll or use plus and minus to zoom."></canvas>
  <script type="module" src="./viewer.mjs"></script>
</body>
</html>
